server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Deploy health check: {"status":"ok","sha":"<commit>"}, written at build time.
    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store";
    }
}
